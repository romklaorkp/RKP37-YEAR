<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>ระบบผ้าป่าเพื่อการศึกษา โรงเรียนร่มเกล้าพิทยาสรรค์</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #fffaf8; color: #382647; }
    .hero-grad { background: linear-gradient(115deg, #4a2c6d 0%, #8a3279 55%, #db0862 100%); }
    .card { background: white; border: 1px solid #ffe4e6; border-radius: 1.25rem; box-shadow: 0 4px 20px -2px rgba(74, 44, 109, 0.05); }
    .badge { display: inline-flex; border-radius: 9999px; padding: 0.25rem 0.75rem; font-size: 0.75rem; font-weight: 700; }
    .badge-approved { background-color: #d1fae5; color: #065f46; }
    .badge-pending { background-color: #fef3c7; color: #92400e; }
    .badge-rejected { background-color: #fee2e2; color: #991b1b; }
    @media print {
      header, aside, nav, .no-print { display: none !important; }
      body { background: white !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-white border-b border-rose-100 sticky top-0 z-40 w-full shadow-xs">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 cursor-pointer select-none" onclick="goRoute('home')">
        <div class="w-11 h-11 rounded-2xl flex items-center justify-center font-extrabold text-white text-lg bg-[#4a2c6d] shrink-0 shadow-md">
          รพ
        </div>
        <div>
          <h1 id="hdr-system" class="font-bold text-lg text-[#4a2c6d] leading-tight">ระบบผ้าป่าเพื่อการศึกษา</h1>
          <p id="hdr-school" class="text-xs text-rose-800/70">โรงเรียนร่มเกล้าพิทยาสรรค์ สพม.มุกดาหาร</p>
        </div>
      </div>
      <nav class="hidden lg:flex items-center gap-1 font-medium text-sm">
        <button type="button" onclick="goRoute('home')" class="nav-btn px-3 py-2 rounded-xl text-[#4a2c6d] hover:bg-rose-50" data-route="home">หน้าแรก</button>
        <button type="button" onclick="goRoute('donate')" class="nav-btn px-3 py-2 rounded-xl text-[#4a2c6d] hover:bg-rose-50" data-route="donate">ร่วมบริจาค</button>
        <button type="button" onclick="goRoute('products')" class="nav-btn px-3 py-2 rounded-xl text-[#4a2c6d] hover:bg-rose-50" data-route="products">ของที่ระลึก</button>
        <button type="button" onclick="goRoute('tables')" class="nav-btn px-3 py-2 rounded-xl text-[#4a2c6d] hover:bg-rose-50" data-route="tables">จองโต๊ะ</button>
        <button type="button" onclick="goRoute('search')" class="nav-btn px-3 py-2 rounded-xl text-[#4a2c6d] hover:bg-rose-50" data-route="search">ค้นหารายการ</button>
      </nav>
      <div class="flex items-center gap-2">
        <button type="button" id="admin-btn" onclick="toggleAdmin()" class="border border-rose-200 text-[#4a2c6d] text-xs font-semibold px-3 py-2 rounded-xl hover:bg-rose-50 flex items-center gap-1.5">
          <i data-lucide="lock-keyhole" class="w-4 h-4"></i>
          <span id="admin-btn-text">ผู้ดูแลระบบ</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Content Container -->
  <div class="max-w-7xl mx-auto w-full flex-1 flex">
    <!-- Admin Sidebar -->
    <aside id="admin-sidebar" class="hidden w-64 p-4 border-r border-rose-100 bg-white shrink-0">
      <div class="space-y-1">
        <button onclick="goRoute('dashboard')" class="side-btn w-full text-left p-2.5 rounded-xl font-bold text-sm text-[#4a2c6d] hover:bg-rose-50 flex items-center gap-2">
          <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Dashboard สถิติ
        </button>
        <button onclick="goRoute('payments')" class="side-btn w-full text-left p-2.5 rounded-xl font-bold text-sm text-[#4a2c6d] hover:bg-rose-50 flex items-center gap-2">
          <i data-lucide="badge-check" class="w-4 h-4"></i> ตรวจสอบสลิป/รายการ
        </button>
        <button onclick="goRoute('admin-products')" class="side-btn w-full text-left p-2.5 rounded-xl font-bold text-sm text-[#4a2c6d] hover:bg-rose-50 flex items-center gap-2">
          <i data-lucide="package" class="w-4 h-4"></i> จัดการสินค้า
        </button>
        <button onclick="goRoute('admin-tables')" class="side-btn w-full text-left p-2.5 rounded-xl font-bold text-sm text-[#4a2c6d] hover:bg-rose-50 flex items-center gap-2">
          <i data-lucide="layout-grid" class="w-4 h-4"></i> จัดการโต๊ะ/ที่นั่ง
        </button>
        <button onclick="goRoute('admin-news')" class="side-btn w-full text-left p-2.5 rounded-xl font-bold text-sm text-[#4a2c6d] hover:bg-rose-50 flex items-center gap-2">
          <i data-lucide="newspaper" class="w-4 h-4"></i> ข่าวประชาสัมพันธ์
        </button>
        <button onclick="goRoute('reports')" class="side-btn w-full text-left p-2.5 rounded-xl font-bold text-sm text-[#4a2c6d] hover:bg-rose-50 flex items-center gap-2">
          <i data-lucide="file-text" class="w-4 h-4"></i> รายงาน & Export
        </button>
        <button onclick="goRoute('settings')" class="side-btn w-full text-left p-2.5 rounded-xl font-bold text-sm text-[#4a2c6d] hover:bg-rose-50 flex items-center gap-2">
          <i data-lucide="settings" class="w-4 h-4"></i> ตั้งค่าระบบ & Telegram
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="view-root" class="flex-1 p-4 md:p-7 min-w-0 pb-20"></main>
  </div>

  <div id="modal-container"></div>
  <div id="toast-container" class="fixed top-20 right-4 z-50 pointer-events-none"></div>

  <script>
    // System State
    var state = {
      route: 'home',
      admin: false,
      role: 'Super Admin',
      settings: {},
      products: [],
      tables: [],
      records: [],
      news: []
    };

    function notify(msg, type) {
      var toast = document.getElementById('toast-container');
      var color = type === 'error' ? 'bg-red-50 text-red-900 border-red-500' : 'bg-emerald-50 text-emerald-900 border-emerald-500';
      toast.innerHTML = '<div class="p-4 border-l-4 ' + color + ' shadow-2xl rounded-2xl font-bold text-sm bg-white">' + msg + '</div>';
      setTimeout(function() { toast.innerHTML = ''; }, 3500);
    }

    function money(n) {
      return Number(n || 0).toLocaleString('th-TH') + ' บาท';
    }

    // Connect to Google Apps Script or Local fallback
    function callBackend(action, params, onSuccess, onError) {
      if (window.google && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(onSuccess)
          .withFailureHandler(onError || function(err) { notify('ข้อผิดพลาด: ' + err, 'error'); })
          [action](params);
      } else {
        // HTTP API fallback
        fetch('/api/' + (action === 'getInitialData' ? 'initial-data' : action), {
          method: action === 'getInitialData' ? 'GET' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: action === 'getInitialData' ? undefined : JSON.stringify(params)
        })
        .then(function(r) { return r.json(); })
        .then(onSuccess)
        .catch(onError || function(err) { notify('ข้อผิดพลาด: ' + err, 'error'); });
      }
    }

    function loadInitial() {
      callBackend('getInitialData', null, function(res) {
        if (res && res.settings) {
          state.settings = res.settings;
          state.products = res.products || [];
          state.tables = res.tables || [];
          state.records = res.records || [];
          state.news = res.news || [];
          document.getElementById('hdr-system').innerText = state.settings.system_name || 'ระบบผ้าป่าเพื่อการศึกษา';
          document.getElementById('hdr-school').innerText = (state.settings.school_name || 'โรงเรียนร่มเกล้าพิทยาสรรค์') + ' สพม.มุกดาหาร';
          render();
        }
      });
    }

    function goRoute(r) {
      state.route = r;
      document.querySelectorAll('.nav-btn').forEach(function(b) {
        if (b.dataset.route === r) {
          b.className = 'nav-btn px-3 py-2 rounded-xl bg-rose-100 text-[#db0862] font-bold shadow-xs';
        } else {
          b.className = 'nav-btn px-3 py-2 rounded-xl text-[#4a2c6d] hover:bg-rose-50 font-medium';
        }
      });
      render();
    }

    function toggleAdmin() {
      state.admin = !state.admin;
      document.getElementById('admin-sidebar').classList.toggle('hidden', !state.admin);
      document.getElementById('admin-btn-text').innerText = state.admin ? 'Super Admin (ออก)' : 'ผู้ดูแลระบบ';
      if (state.admin) goRoute('dashboard');
      else goRoute('home');
    }

    function render() {
      var root = document.getElementById('view-root');
      if (state.route === 'home') renderHome(root);
      else if (state.route === 'donate') renderDonate(root);
      else if (state.route === 'products') renderProducts(root);
      else if (state.route === 'tables') renderTables(root);
      else if (state.route === 'search') renderSearch(root);
      else if (state.route === 'dashboard') renderDashboard(root);
      else if (state.route === 'payments') renderPayments(root);
      if (window.lucide) lucide.createIcons();
    }

    function renderHome(root) {
      var approvedSum = state.records.filter(function(r) { return r.kind === 'บริจาค' && r.status === 'approved'; }).reduce(function(a, b) { return a + b.amount; }, 0);
      var total = (state.settings.donation_baseline || 0) + approvedSum;
      var goal = state.settings.fundraising_goal || 500000;
      var pct = Math.min(100, (total / goal) * 100).toFixed(1);

      root.innerHTML = '<div class="space-y-6">' +
        '<div class="hero-grad rounded-3xl p-8 md:p-12 text-white shadow-xl">' +
          '<div class="inline-block bg-white/20 rounded-full px-4 py-1 text-xs font-semibold mb-4">ผ้าป่าเพื่อการศึกษา 2569</div>' +
          '<h2 class="text-3xl md:text-5xl font-black mb-2">' + (state.settings.system_name || 'ระบบผ้าป่าเพื่อการศึกษา') + '</h2>' +
          '<p class="text-rose-200 text-lg font-bold mb-6">' + (state.settings.school_name || 'โรงเรียนร่มเกล้าพิทยาสรรค์') + '</p>' +
          '<div class="bg-white/15 p-5 rounded-2xl max-w-xl backdrop-blur-sm">' +
            '<div class="flex justify-between font-bold text-sm mb-2"><span>ความคืบหน้าระดมทุน</span><span>' + pct + '%</span></div>' +
            '<div class="h-3 bg-white/30 rounded-full overflow-hidden"><div class="h-full bg-amber-300 rounded-full" style="width:' + pct + '%"></div></div>' +
            '<div class="flex justify-between text-xs mt-3"><span>ได้รับแล้ว: ' + money(total) + '</span><span>เป้าหมาย: ' + money(goal) + '</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="grid grid-cols-2 md:grid-cols-4 gap-4">' +
          '<div class="card p-5"><span class="text-xs text-slate-400 font-bold">เป้าหมาย</span><div class="text-xl font-black text-[#4a2c6d] mt-2">' + money(goal) + '</div></div>' +
          '<div class="card p-5"><span class="text-xs text-slate-400 font-bold">ยอดเงินสะสม</span><div class="text-xl font-black text-[#db0862] mt-2">' + money(total) + '</div></div>' +
          '<div class="card p-5"><span class="text-xs text-slate-400 font-bold">ผู้ร่วมบริจาค</span><div class="text-xl font-black text-purple-700 mt-2">' + (state.settings.donor_baseline + state.records.filter(function(r) { return r.kind === 'บริจาค'; }).length) + ' ราย</div></div>' +
          '<div class="card p-5"><span class="text-xs text-slate-400 font-bold">โต๊ะจองแล้ว</span><div class="text-xl font-black text-emerald-600 mt-2">' + state.tables.filter(function(t) { return t.status === 'booked'; }).length + ' / ' + state.tables.length + '</div></div>' +
        '</div>' +
        '<div class="grid grid-cols-2 md:grid-cols-4 gap-4">' +
          '<button onclick="goRoute(\'donate\')" class="card p-5 text-left hover:scale-105 transition-transform"><div class="w-10 h-10 rounded-xl bg-[#db0862] text-white flex items-center justify-center mb-3"><i data-lucide="heart-handshake"></i></div><h4 class="font-bold">ร่วมบริจาค</h4><p class="text-xs text-slate-500 mt-1">พร้อมรับใบอนุโมทนา</p></button>' +
          '<button onclick="goRoute(\'products\')" class="card p-5 text-left hover:scale-105 transition-transform"><div class="w-10 h-10 rounded-xl bg-purple-700 text-white flex items-center justify-center mb-3"><i data-lucide="shopping-bag"></i></div><h4 class="font-bold">ของที่ระลึก</h4><p class="text-xs text-slate-500 mt-1">เสื้อผ้าป่า และของที่ระลึก</p></button>' +
          '<button onclick="goRoute(\'tables\')" class="card p-5 text-left hover:scale-105 transition-transform"><div class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center mb-3"><i data-lucide="layout-grid"></i></div><h4 class="font-bold">จองโต๊ะ 80 ตัว</h4><p class="text-xs text-slate-500 mt-1">ผังที่นั่งโต๊ะละ 8 คน</p></button>' +
          '<button onclick="goRoute(\'search\')" class="card p-5 text-left hover:scale-105 transition-transform"><div class="w-10 h-10 rounded-xl bg-amber-600 text-white flex items-center justify-center mb-3"><i data-lucide="search"></i></div><h4 class="font-bold">ค้นหารายการ</h4><p class="text-xs text-slate-500 mt-1">พิมพ์ใบรับเงิน PDF</p></button>' +
        '</div>' +
      '</div>';
    }

    function renderDonate(root) {
      root.innerHTML = '<div class="max-w-2xl mx-auto space-y-6">' +
        '<h2 class="text-2xl font-black text-[#4a2c6d]">ร่วมบริจาคผ้าป่าเพื่อการศึกษา</h2>' +
        '<div class="card p-6 space-y-4">' +
          '<div class="bg-rose-50 p-4 rounded-xl flex items-center gap-4">' +
            '<div class="w-24 h-24 bg-white border border-rose-200 rounded-xl flex items-center justify-center font-bold text-xs">PromptPay QR</div>' +
            '<div><p class="font-bold text-[#4a2c6d]">' + (state.settings.pp_recipient || 'โรงเรียนร่มเกล้าพิทยาสรรค์') + '</p><p class="text-xs text-slate-500">หมายเลข: ' + (state.settings.pp_number || '0812345678') + '</p></div>' +
          '</div>' +
          '<form onsubmit="handleDonate(event)" class="space-y-3">' +
            '<div><label class="block text-xs font-bold mb-1">ชื่อ - นามสกุล *</label><input name="name" required class="w-full border border-rose-200 rounded-xl p-2.5 text-sm"></div>' +
            '<div><label class="block text-xs font-bold mb-1">เบอร์โทรศัพท์ *</label><input name="phone" required type="tel" class="w-full border border-rose-200 rounded-xl p-2.5 text-sm"></div>' +
            '<div><label class="block text-xs font-bold mb-1">จำนวนเงิน (บาท) *</label><input name="amount" type="number" required min="1" class="w-full border border-rose-200 rounded-xl p-2.5 text-sm font-bold text-[#db0862]"></div>' +
            '<div><label class="block text-xs font-bold mb-1">แนบสลิปโอนเงิน</label><input name="slip" type="file" accept="image/*,.pdf" class="w-full border border-rose-200 rounded-xl p-1.5 text-xs"></div>' +
            '<button type="submit" class="w-full py-3 bg-[#db0862] text-white font-bold rounded-xl mt-4">ส่งข้อมูลบริจาค</button>' +
          '</form>' +
        '</div>' +
      '</div>';
    }

    function handleDonate(e) {
      e.preventDefault();
      var form = e.target;
      var file = form.elements.slip.files[0];
      var sendData = function(slipBase64) {
        notify('กำลังส่งข้อมูลบริจาค…');
        callBackend('submitDonation', {
          name: form.elements.name.value,
          phone: form.elements.phone.value,
          amount: Number(form.elements.amount.value),
          visible: true,
          receipt: true,
          slipBase64: slipBase64 || ''
        }, function(res) {
          notify(res.message || 'ส่งข้อมูลบริจาคสำเร็จ!');
          loadInitial();
          goRoute('search');
        });
      };

      if (file) {
        var reader = new FileReader();
        reader.onload = function() { sendData(reader.result); };
        reader.readAsDataURL(file);
      } else {
        sendData('');
      }
    }

    function renderProducts(root) {
      root.innerHTML = '<div class="space-y-6"><h2 class="text-2xl font-black text-[#4a2c6d]">ของที่ระลึกงานผ้าป่า</h2>' +
        '<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">' +
        state.products.map(function(p) {
          var avail = p.stock - p.reserved;
          return '<div class="card overflow-hidden p-5 flex flex-col justify-between">' +
            '<div><h3 class="font-bold text-lg text-[#4a2c6d]">' + p.name + '</h3><p class="text-2xl font-black text-[#db0862] my-2">' + money(p.price) + '</p><p class="text-xs text-slate-500">คงเหลือ ' + avail + ' ชิ้น</p></div>' +
            '<button onclick="alert(\'กรุณาใช้หน้าหลักในการเลือกไซซ์และสั่งจอง\')" class="w-full py-2 bg-[#db0862] text-white font-bold rounded-xl mt-4">สั่งจองของที่ระลึก</button>' +
          '</div>';
        }).join('') +
        '</div></div>';
    }

    function renderTables(root) {
      root.innerHTML = '<div class="space-y-6"><h2 class="text-2xl font-black text-[#4a2c6d]">จองโต๊ะออนไลน์ (80 โต๊ะ)</h2>' +
        '<div class="card p-6">' +
          '<div class="bg-[#4a2c6d] text-white text-center py-2.5 rounded-xl font-bold text-sm mb-6">เวที / MAIN STAGE</div>' +
          '<div class="grid grid-cols-4 sm:grid-cols-8 lg:grid-cols-10 gap-2">' +
          state.tables.map(function(t) {
            var color = t.status === 'available' ? 'bg-emerald-50 text-emerald-800 border-emerald-300' : (t.status === 'pending' ? 'bg-amber-50 text-amber-800 border-amber-300' : 'bg-red-50 text-red-800 border-red-200');
            return '<div class="p-2 border rounded-xl text-center ' + color + ' font-bold text-xs"><p class="text-sm">' + t.number + '</p><span class="text-[10px]">' + (t.status === 'available' ? 'ว่าง' : t.status === 'pending' ? 'รอชำระ' : 'จองแล้ว') + '</span></div>';
          }).join('') +
          '</div>' +
        '</div></div>';
    }

    function renderSearch(root) {
      root.innerHTML = '<div class="max-w-xl mx-auto space-y-6"><h2 class="text-2xl font-black text-[#4a2c6d]">ค้นหารายการ</h2>' +
        '<div class="card p-6 space-y-4">' +
          '<input id="q-id" placeholder="เลขที่รายการ เช่น DON-2569-000124" class="w-full border border-rose-200 rounded-xl p-3 text-sm font-mono uppercase">' +
          '<input id="q-phone" placeholder="เบอร์โทรศัพท์ที่ใช้ทำรายการ" class="w-full border border-rose-200 rounded-xl p-3 text-sm">' +
          '<button onclick="handleSearch()" class="w-full py-3 bg-[#db0862] text-white font-bold rounded-xl">ค้นหา</button>' +
          '<div id="q-res" class="pt-4"></div>' +
        '</div></div>';
    }

    function handleSearch() {
      var id = document.getElementById('q-id').value.trim();
      var phone = document.getElementById('q-phone').value.trim();
      callBackend('searchRecord', { id: id, phone: phone }, function(res) {
        var box = document.getElementById('q-res');
        if (res && res.success && res.record) {
          var r = res.record;
          box.innerHTML = '<div class="p-4 bg-rose-50 rounded-2xl space-y-1"><h4 class="font-bold text-[#4a2c6d]">' + r.id + ' (' + r.kind + ')</h4><p class="text-sm">ผู้ทำรายการ: ' + r.name + '</p><p class="text-sm font-bold text-[#db0862]">ยอดเงิน: ' + money(r.amount) + '</p><p class="text-xs">สถานะ: ' + r.status + '</p></div>';
        } else {
          box.innerHTML = '<p class="text-sm text-red-600 font-bold">ไม่พบรายการที่ตรงกับข้อมูล</p>';
        }
      });
    }

    function renderDashboard(root) {
      root.innerHTML = '<div class="space-y-6"><h2 class="text-2xl font-black text-[#4a2c6d]">Admin Dashboard</h2>' +
        '<div class="grid grid-cols-2 md:grid-cols-4 gap-4">' +
          '<div class="card p-5"><span class="text-xs text-slate-400 font-bold">ยอดบริจาค</span><div class="text-xl font-black text-[#db0862] mt-2">' + money(state.settings.donation_baseline) + '</div></div>' +
          '<div class="card p-5"><span class="text-xs text-slate-400 font-bold">โต๊ะจองแล้ว</span><div class="text-xl font-black text-amber-600 mt-2">' + state.tables.filter(function(t) { return t.status === 'booked'; }).length + '</div></div>' +
          '<div class="card p-5"><span class="text-xs text-slate-400 font-bold">ผู้ร่วมงาน</span><div class="text-xl font-black text-purple-700 mt-2">' + state.settings.attendees + ' คน</div></div>' +
          '<div class="card p-5"><span class="text-xs text-slate-400 font-bold">รอตรวจสอบ</span><div class="text-xl font-black text-red-600 mt-2">' + state.records.filter(function(r) { return r.status === 'pending'; }).length + ' รายการ</div></div>' +
        '</div></div>';
    }

    function renderPayments(root) {
      root.innerHTML = '<div class="space-y-6"><h2 class="text-2xl font-black text-[#4a2c6d]">รายการและตรวจสอบสลิป</h2>' +
        '<div class="card overflow-x-auto"><table class="w-full text-left text-sm"><thead class="bg-rose-50"><tr><th class="p-3">เลขที่</th><th>ประเภท</th><th>ผู้ทำรายการ</th><th>ยอดเงิน</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>' +
        state.records.map(function(r) {
          return '<tr class="border-t"><td class="p-3 font-mono font-bold">' + r.id + '</td><td>' + r.kind + '</td><td>' + r.name + '</td><td class="font-bold text-[#db0862]">' + money(r.amount) + '</td><td>' + r.status + '</td><td><button onclick="approveRecord(\'' + r.id + '\',\'' + r.kind + '\')" class="text-xs font-bold text-emerald-600 mr-2">อนุมัติ</button><button onclick="rejectRecord(\'' + r.id + '\',\'' + r.kind + '\')" class="text-xs font-bold text-red-600">ไม่อนุมัติ</button></td></tr>';
        }).join('') +
        '</tbody></table></div></div>';
    }

    function approveRecord(id, kind) {
      if (confirm('ยืนยันอนุมัติรายการ ' + id + ' หรือไม่?')) {
        callBackend('updateRecordStatus', { id: id, kind: kind, status: 'approved' }, function() {
          notify('อนุมัติเรียบร้อยแล้ว');
          loadInitial();
        });
      }
    }

    function rejectRecord(id, kind) {
      var reason = prompt('ระบุเหตุผลที่ไม่อนุมัติ:');
      if (reason) {
        callBackend('updateRecordStatus', { id: id, kind: kind, status: 'rejected', reason: reason }, function() {
          notify('บันทึกผลไม่อนุมัติแล้ว');
          loadInitial();
        });
      }
    }

    // Init on load
    loadInitial();
  </script>
</body>
</html>
