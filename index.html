<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบผ้าป่าเพื่อการศึกษา โรงเรียนร่มเกล้าพิทยาสรรค์</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.5/dist/sweetalert2.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root { --p: #db0862; --p2: #f51b70; --pu: #4a2c6d; --or: #ff8a65; --bd: #eee5f2; --mu: #7a6b88; }
body { font-family: 'Sarabun', sans-serif; color: #2a1a3a; background: #faf7fb;
  background-image: radial-gradient(800px 480px at 8% -10%, rgba(74,44,109,.12), transparent 60%), radial-gradient(700px 480px at 100% 0, rgba(219,8,98,.09), transparent 55%);
  background-attachment: fixed; }
.card { border-radius: 24px; border: 1px solid var(--bd); box-shadow: 0 4px 18px rgba(74,44,109,.06); }
.btn { border-radius: 14px; font-weight: 600; }
.btn-brand { background: linear-gradient(135deg, var(--p), var(--p2)); color: #fff; border: 0; }
.btn-brand:hover { color: #fff; filter: brightness(1.08); }
.form-control, .form-select { border-radius: 14px; background-color: #faf7fb; border-color: var(--bd); }
.form-control:focus, .form-select:focus { border-color: var(--p2); box-shadow: 0 0 0 .2rem rgba(245,27,112,.15); }
.ico { width: 44px; height: 44px; border-radius: 14px; display: inline-grid; place-items: center; color: #fff; font-size: 1.3rem; flex: none;
  background: var(--g); position: relative; overflow: hidden;
  box-shadow: 0 5px 0 rgba(0,0,0,.2), 0 10px 18px rgba(0,0,0,.2), inset 0 2px 2px rgba(255,255,255,.55); }
.ico::before { content: ""; position: absolute; inset: 0 0 50% 0; background: linear-gradient(rgba(255,255,255,.45), transparent); }
.ico.sm { width: 34px; height: 34px; font-size: 1rem; border-radius: 11px; }
.sh { display: flex; align-items: center; gap: .9rem; margin: 2rem 0 .8rem; font-weight: 700; }
.sh::after { content: ""; flex: 1; height: 3px; border-radius: 99px; background: linear-gradient(90deg, #4a2c6d, #db0862 55%, #ff8a65); }
.hero { border-radius: 28px; color: #fff; background: linear-gradient(135deg, #4a2c6d, #db0862 60%, #ff8a65); }
.hbtn { width: 100%; border: 0; border-radius: 20px; text-align: left; padding: 1rem; background: #fff; color: #2a1a3a; box-shadow: 0 8px 20px rgba(0,0,0,.15); transition: .2s; }
.hbtn:hover { transform: translateY(-3px); }
.skel { height: 90px; border-radius: 20px; background: linear-gradient(90deg, #eee5f2 25%, #fff 50%, #eee5f2 75%); background-size: 200% 100%; animation: sk 1.2s infinite; }
@keyframes sk { to { background-position: -200% 0; } }
#ld { display: none; position: fixed; inset: 0; z-index: 3000; background: #4a2c6dcc; place-items: center; }
.nav-pills .nav-link { color: var(--mu); font-weight: 600; border-radius: 14px; white-space: nowrap; }
.nav-pills .nav-link.active { background: linear-gradient(135deg, var(--p), var(--p2)); color: #fff; }
.tl { border-left: 2px solid var(--bd); padding-left: 18px; }
.tli { position: relative; padding-bottom: 14px; }
.tli::before { content: ""; position: absolute; left: -25px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: linear-gradient(135deg, #db0862, #ff8a65); box-shadow: 0 0 0 4px #fff; }
.tb { border: 0; border-radius: 18px; color: #fff; font-weight: 700; padding: 1rem .2rem; transition: .15s; }
.tb:not(:disabled):hover { transform: scale(1.05); }
.thead-g th { background: linear-gradient(90deg, #4a2c6d, #db0862); color: #fff; border: 0; white-space: nowrap; }
.bottom-nav a { font-size: .7rem; text-decoration: none; color: var(--mu); text-align: center; }
.bottom-nav a.on { color: var(--p); font-weight: 700; }
.swal2-popup { border-radius: 28px !important; font-family: 'Sarabun', sans-serif !important; }
.swal2-confirm, .swal2-deny, .swal2-cancel { border-radius: 14px !important; }
.fade-in { animation: fi .35s; } @keyframes fi { from { opacity: 0; transform: translateY(8px); } }
</style>
</head>
<body>
<div id="ld"><div class="spinner-border text-light" style="width:3rem;height:3rem"></div></div>
<div id="app"><div class="container py-4"><div class="skel mb-3"></div><div class="skel" style="height:220px"></div></div></div>

<script>
/* ================== ตั้งค่าการเชื่อมต่อ (JSONP → Code.gs) ================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyPEn6pw5DZaAsHo8RgydfP7CMgXKjh-x2wCQBlBzjpys8pK3ABMj3OMLXzhgDIr_QMIw/exec';
const SHIP = 40;

/* ================== ตัวช่วยทั่วไป ================== */
const $ = s => document.querySelector(s);
const fm = n => Number(n || 0).toLocaleString('th-TH');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const spin = v => $('#ld').style.display = v ? 'grid' : 'none';
const toast = (t, i = 'success') => Swal.fire({ icon: i, title: t, confirmButtonColor: '#db0862', timer: 2000 });
const ST = { ok: ['ยืนยันแล้ว', 'success'], wait: ['รอตรวจสอบ', 'warning'], no: ['ไม่ผ่าน', 'danger'] };
const bd = s => `<span class="badge rounded-pill text-bg-${(ST[s] || ST.wait)[1]}">${(ST[s] || ST.wait)[0]}</span>`;
const ico = (n, g, s = '') => `<span class="ico ${s}" style="--g:linear-gradient(145deg,${g})"><i class="bi bi-${n}"></i></span>`;
const dt = t => new Date(t).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });

let D, V = 'home', TK = null, ROLE = '', AT = 'dash', cart = [], selT = null, LST = [], RR = [], UU = [], CC = {}, charts = [];
let RP = { p: 'all', d: new Date().toISOString().slice(0, 10), t: 'all' };

/* ---------- JSONP ---------- */
let cbN = 0;
function call(action, args = [], o = {}) {
  return new Promise((resolve, reject) => {
    if (!o.quiet) spin(1);
    const cb = 'jp' + Date.now().toString(36) + (cbN++), s = document.createElement('script');
    let done = false, tm;
    const finish = () => { if (done) return false; done = true; clearTimeout(tm); delete window[cb]; s.remove(); if (!o.quiet) spin(0); return true; };
    const fail = m => {
      if (!finish()) return;
      if (!o.silent) Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: m, confirmButtonColor: '#db0862' });
      reject(new Error(m));
    };
    tm = setTimeout(() => fail('หมดเวลาเชื่อมต่อเซิร์ฟเวอร์'), 60000);
    window[cb] = r => { if (r && r.ok) { if (finish()) resolve(r.data); } else fail((r && r.error) || 'ไม่ทราบสาเหตุ'); };
    s.onerror = () => fail('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้');
    s.src = API_URL + '?action=' + action + '&a=' + encodeURIComponent(JSON.stringify(args)) + '&callback=' + cb + '&_=' + Date.now();
    document.body.appendChild(s);
  });
}

/* ---------- อัปโหลดรูป/สลิป: ย่อรูป → แบ่งชิ้นส่งผ่าน JSONP → ได้รหัสอ้างอิง ref ---------- */
const shrink = (file, max, q) => new Promise((ok, no) => {
  const r = new FileReader();
  r.onload = () => {
    const i = new Image();
    i.onload = () => {
      const k = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement('canvas');
      c.width = Math.round(i.width * k); c.height = Math.round(i.height * k);
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', q));
    };
    i.onerror = () => no(new Error('อ่านไฟล์รูปไม่ได้'));
    i.src = r.result;
  };
  r.readAsDataURL(file);
});
async function up(file, max = 800, q = .6) {
  if (!file) return '';
  const data = await shrink(file, max, q);
  const b = data.split(',')[1].replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const id = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), SZ = 1800, N = Math.ceil(b.length / SZ);
  spin(1);
  try {
    let i = 0;
    await Promise.all(Array.from({ length: 5 }, async () => {
      while (i < N) {
        const k = i++;
        for (let t = 1; t <= 3; t++) {
          try { await call('chunk', [id, k, b.slice(k * SZ, k * SZ + SZ)], { quiet: true, silent: true }); break; }
          catch (e) { if (t === 3) throw new Error('อัปโหลดไฟล์ไม่สำเร็จ กรุณาลองใหม่'); }
        }
      }
    }));
  } catch (e) { spin(0); Swal.fire({ icon: 'error', title: e.message }); throw e; }
  spin(0);
  return 'ref:' + id + ':' + N;
}
const killCharts = () => { charts.forEach(c => c.destroy()); charts = []; };
const badgeP = { id: 'bd', afterDatasetsDraw(c) { const x = c.ctx; c.data.datasets.forEach((d, i) => c.getDatasetMeta(i).data.forEach((e, j) => {
  const v = d.data[j]; if (!v) return; const p = e.getCenterPoint(), t = fm(v);
  x.save(); x.font = '600 11px Sarabun'; const w = x.measureText(t).width + 12;
  x.fillStyle = '#4a2c6d'; x.beginPath(); x.roundRect(p.x - w / 2, p.y - 9, w, 18, 9); x.fill();
  x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(t, p.x, p.y + 1); x.restore();
})); } };
const PAL = ['#db0862', '#4a2c6d', '#ff8a65', '#26a69a', '#ffca28', '#0288d1', '#aed581'];
const mkChart = (id, type, labels, data, colors) => { const el = document.getElementById(id); if (!el) return;
  charts.push(new Chart(el, { type, data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0, borderRadius: type === 'bar' ? 8 : 0 }] }, plugins: [badgeP],
    options: { maintainAspectRatio: false, plugins: { legend: { display: type !== 'bar', position: 'bottom' } }, scales: type === 'bar' ? { y: { beginAtZero: true }, x: { grid: { display: false } } } : {} } })); };

/* ---------- ฟอร์ม modal กลาง: F=[{k,l,h,t:'text|number|textarea|file|password'}] ---------- */
async function form(title, F, v = {}) {
  const r = await Swal.fire({
    title, width: 'min(620px,94vw)', showCancelButton: true, confirmButtonText: '<i class="bi bi-save"></i> บันทึก', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#db0862',
    html: `<div class="text-start" style="max-height:60vh;overflow:auto">${F.map((f, i) => `<div class="mt-3"><label class="form-label fw-bold mb-0">${i + 1}) ${f.l}</label>${f.h ? `<div class="small text-muted">${f.h}</div>` : ''}${
      f.t === 'textarea' ? `<textarea id="f_${f.k}" class="form-control mt-1" rows="4">${esc(v[f.k])}</textarea>`
      : `<input id="f_${f.k}" type="${f.t || 'text'}" ${f.t === 'file' ? 'accept="image/*"' : ''} class="form-control mt-1" value="${f.t === 'file' ? '' : esc(v[f.k])}">`}</div>`).join('')}</div>`,
    preConfirm: async () => { const o = {}; for (const f of F) { const e = document.getElementById('f_' + f.k); o[f.k] = f.t === 'file' ? await up(e.files[0], 900, .7) : e.value; } return o; }
  });
  return r.isConfirmed ? r.value : null;
}
const sure = async t => (await Swal.fire({ icon: 'warning', title: t, showCancelButton: true, confirmButtonColor: '#d32f2f', confirmButtonText: 'ยืนยัน', cancelButtonText: 'ยกเลิก' })).isConfirmed;
function printHtml(h) { const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;width:0;height:0;border:0'; document.body.appendChild(f); f.contentDocument.write(h); f.contentDocument.close(); setTimeout(() => f.contentWindow.print(), 500); }
const F = (id, l, t = 'text', x = '', c = 'mb-2') => `<div class="${c}"><label class="form-label small text-muted mb-1">${l}</label><input id="${id}" type="${t}" class="form-control" ${x}></div>`;

/* ================== เริ่มต้นระบบ ================== */
async function load() { D = await call('getPublic', [], { quiet: true }); }
async function boot() {
  try { await load(); draw(); }
  catch (e) { $('#app').innerHTML = `<div class="container py-5"><div class="card p-4 text-center"><h5>เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ</h5><p class="text-muted">${esc(e.message)}<br>ตรวจสอบว่าได้รัน setup() และ Deploy เป็น Web app (Access: Anyone) แล้ว</p><button class="btn btn-brand mx-auto" onclick="boot()">ลองใหม่</button></div></div>`; }
}
const go = v => { V = v; scrollTo(0, 0); draw(); };

/* ================== หน้าสาธารณะ ================== */
const NAV = [['home', 'house-heart-fill', 'หน้าแรก', '#4a2c6d,#8a5cc4'], ['donate', 'heart-fill', 'บริจาค', '#db0862,#ff5c9a'], ['shop', 'bag-heart-fill', 'ของที่ระลึก', '#f57c00,#ff8a65'], ['table', 'grid-3x3-gap-fill', 'จองโต๊ะ', '#26a69a,#0288d1'], ['search', 'search', 'ค้นหา', '#0288d1,#4a2c6d']];
function draw() {
  killCharts();
  if (V === 'admin') return adm();
  const c = D.cfg;
  $('#app').innerHTML = `
  <nav class="navbar sticky-top border-bottom" style="background:#faf7fbd9;backdrop-filter:blur(8px)"><div class="container gap-2">
    <a class="navbar-brand d-flex align-items-center gap-2 m-0" role="button" onclick="go('home')">${c.Logo ? `<img src="${esc(c.Logo)}" width="40" height="40" class="rounded-3 object-fit-cover">` : ico('building-fill', '#4a2c6d,#8a5cc4', 'sm')}<b class="fs-6">${esc(c.SystemName)}</b></a>
    <ul class="nav nav-pills ms-auto d-none d-md-flex">${NAV.map(n => `<li class="nav-item"><a role="button" class="nav-link ${V === n[0] ? 'active' : ''}" onclick="go('${n[0]}')"><i class="bi bi-${n[1]}"></i> ${n[2]}</a></li>`).join('')}</ul>
    <button class="btn btn-outline-secondary btn-sm ms-auto ms-md-2" onclick="go('admin')"><i class="bi bi-key-fill"></i> Admin</button>
  </div></nav>
  <main class="container py-3 fade-in" id="m" style="padding-bottom:6rem!important"></main>
  <nav class="bottom-nav d-md-none fixed-bottom bg-white border-top shadow rounded-top-4"><div class="d-flex justify-content-around align-items-end py-1">${NAV.map(n => `<a role="button" class="${V === n[0] ? 'on' : ''}" onclick="go('${n[0]}')">${ico(n[1], n[3], 'sm')}<div>${n[2]}</div></a>`).join('')}</div></nav>`;
  ({ home, donate, shop, table, search })[V]($('#m'));
}
function home(m) {
  const c = D.cfg, pct = Math.min(100, D.sum / (+c.Target || 1) * 100);
  m.innerHTML = `
  <section class="hero p-4 p-md-5" style="${c.Banner ? `background:linear-gradient(#4a2c6dcc,#db0862aa),url(${esc(c.Banner)}) center/cover` : ''}">
    <div class="small">🙏 งานผ้าป่าเพื่อการศึกษา</div>
    <h1 class="fw-bold">${esc(c.Subtitle)}</h1>
    <p class="opacity-75 mb-0">${esc(c.SystemName)} · โรงเรียนร่มเกล้าพิทยาสรรค์</p>
    <div class="row row-cols-2 row-cols-md-4 g-3 mt-2">${[['donate', 'heart-fill', 'ร่วมบริจาค', '#db0862,#ff5c9a'], ['shop', 'bag-heart-fill', 'จองของที่ระลึก', '#f57c00,#ff8a65'], ['table', 'grid-3x3-gap-fill', 'จองโต๊ะออนไลน์', '#26a69a,#0288d1'], ['search', 'search', 'ค้นหารายการ', '#0288d1,#4a2c6d']]
      .map(b => `<div class="col"><button class="hbtn" onclick="go('${b[0]}')">${ico(b[1], b[3])}<div class="fw-bold mt-2">${b[2]}</div></button></div>`).join('')}</div>
  </section>
  <div class="sh"><i class="bi bi-bar-chart-fill"></i> ภาพรวมการระดมทุน</div>
  <div class="row g-3"><div class="col-md-8"><div class="card p-4 h-100">
    <div class="d-flex justify-content-between align-items-end"><div><div class="small text-muted">🎯 เป้าหมาย ${fm(c.Target)} บาท</div><div class="fs-2 fw-bold" style="color:var(--p)">${fm(D.sum)} บาท</div></div><span class="badge rounded-pill" style="background:var(--pu)">${pct.toFixed(1)}%</span></div>
    <div class="progress mt-3" style="height:16px;border-radius:99px"><div class="progress-bar" style="width:${pct}%;background:linear-gradient(90deg,#ff8a65,#db0862)"></div></div>
    <div class="row text-center g-2 mt-2">${[['people-fill', D.donors, 'ผู้ร่วมบริจาค', '#db0862,#ff5c9a'], ['grid-3x3-gap-fill', D.tableBooked + '/' + D.tables.length, 'โต๊ะที่จอง', '#26a69a,#0288d1'], ['bag-heart-fill', D.sold, 'ของที่ระลึก', '#f57c00,#ff8a65']]
      .map(x => `<div class="col-4"><div class="rounded-4 p-2" style="background:#faf7fb">${ico(x[0], x[3], 'sm')}<div class="fw-bold">${x[1]}</div><div class="small text-muted">${x[2]}</div></div></div>`).join('')}</div>
  </div></div><div class="col-md-4"><div class="card p-3 h-100"><div class="small text-muted">% การบริจาคจากเป้าหมาย</div><div style="height:190px"><canvas id="c1"></canvas></div></div></div></div>
  <div class="sh"><i class="bi bi-calendar-event-fill"></i> กำหนดการ &amp; ผู้ร่วมบริจาคล่าสุด</div>
  <div class="row g-3"><div class="col-md-6"><div class="card p-4 h-100">
    <div class="rounded-4 p-3 mb-3 small" style="background:#faf7fb">🎯 ${esc(c.Objective)}</div>
    <div class="tl">${D.schedule.map(x => `<div class="tli"><b>${esc(x.Title)}</b><div class="small" style="color:var(--p)">${esc(x.DateText)}</div><div class="small text-muted">${esc(x.Detail)}</div>${x.ImageURL ? `<img src="${esc(x.ImageURL)}" class="img-fluid rounded-4 mt-2" style="max-height:160px;width:100%;object-fit:cover">` : ''}</div>`).join('')}</div>
  </div></div><div class="col-md-6"><div class="card p-4 h-100"><h6 class="fw-bold">💝 ผู้ร่วมบริจาคล่าสุด</h6>${D.recent.map(d => `<div class="d-flex justify-content-between align-items-center py-2 border-bottom"><div><b class="small">${esc(d.name)}</b><div class="small text-muted">${esc(d.type)} · ${dt(d.at)}</div></div><span class="badge rounded-pill text-bg-success">${fm(d.amt)} ฿</span></div>`).join('') || '<div class="text-muted small">ยังไม่มีรายการ</div>'}</div></div></div>
  <div class="sh"><i class="bi bi-newspaper"></i> ข่าวประชาสัมพันธ์</div>
  <div class="card p-4">${D.news.map(n => `<div class="py-2 border-bottom"><b>${esc(n.Title)}</b><div class="small text-muted">${esc(n.Detail)}</div>${n.ImageURL ? `<img src="${esc(n.ImageURL)}" class="img-fluid rounded-4 mt-2" style="max-height:220px">` : ''}</div>`).join('') || '<span class="text-muted">ยังไม่มีข่าว</span>'}</div>`;
  mkChart('c1', 'doughnut', ['บริจาคแล้ว', 'คงเหลือ'], [Math.round(D.sum), Math.max(0, c.Target - D.sum)], ['#db0862', '#e5dcec']);
}
const pay = () => `<div class="rounded-4 p-3 text-center mb-3" style="background:#faf7fb"><div class="small text-muted mb-1">สแกน QR PromptPay</div>${D.cfg.QRImage ? `<img src="${esc(D.cfg.QRImage)}" class="img-fluid rounded-3" style="width:180px">` : '<i class="bi bi-qr-code fs-1"></i>'}${D.cfg.PromptPay ? `<div class="fw-semibold mt-1">PromptPay: ${esc(D.cfg.PromptPay)}</div>` : ''}</div>
  <div class="mb-3"><label class="form-label small text-muted mb-1"><i class="bi bi-paperclip"></i> อัปโหลดสลิปการโอนเงิน</label><input id="slip" type="file" accept="image/*" class="form-control"></div>`;
function donate(m) {
  m.innerHTML = `<div class="row g-3"><div class="col-lg-7"><div class="card p-4"><h4 class="fw-bold mb-3"><i class="bi bi-heart-fill" style="color:var(--p)"></i> ร่วมบริจาคสมทบทุนเพื่อการศึกษา</h4>
    <div class="row">${F('dn', 'ชื่อ–นามสกุล', 'text', '', 'col-sm-6 mb-2')}${F('dp', 'เบอร์โทรศัพท์', 'tel', '', 'col-sm-6 mb-2')}${F('de', 'อีเมล', 'email', '', 'col-sm-6 mb-2')}

  },
  async rpt(m) {

    const sum = s => RR.filter(r => r.st === s).reduce((a, r) => a + r.amt, 0), KC = { 'บริจาค': '#db0862', 'สินค้า': '#ff8a65', 'โต๊ะ': '#26a69a' };

    <div class="row g-3 mb-3">${[['รายการ', RR.length, '#4a2c6d,#8a5cc4'], ['ยืนยันแล้ว', fm(sum('ok')) + ' บาท', '#26a69a,#aed581'], ['รอตรวจสอบ', fm(sum('wait')) + ' บาท', '#f57c00,#ffca28'], ['ไม่ผ่าน', RR.filter(r => r.st === 'no').length, '#d32f2f,#ff8a65']].map(c => `<div class="col-6 col-lg-3"><div class="rounded-4 p-3 text-white" style="background:linear-gradient(135deg,${c[2]})"><div class="small">${c[0]}</div><b class="fs-5">${c[1]}</b></div></div>`).join('')}</div>
    <div class="card p-3"><div class="table-responsive"><table class="table table-striped align-middle mb-0"><thead class="thead-g"><tr><th>วันที่</th><th>เลขที่</th><th>ประเภท</th><th>ผู้ทำรายการ</th><th>รายละเอียด</th><th class="text-end">จำนวนเงิน</th><th>สถานะ</th></tr></thead><tbody>${RR.map(r => `<tr><td class="text-nowrap">${dt(r.at)}</td><td>${esc(r.id)}</td><td><span class="badge" style="background:${KC[r.k]}">${r.k}</span></td><td>${esc(r.who)}</td><td class="text-muted small">${esc(r.det)}</td><td class="text-end fw-semibold">${fm(r.amt)}</td><td>${bd(r.st)}</td></tr>`).join('') || '<tr><td colspan="7" class="text-center text-muted py-4">ไม่มีข้อมูลในช่วงที่เลือก</td></tr>'}</tbody><tfoot><tr><td colspan="5" class="text-end fw-bold">รวมที่ยืนยันแล้ว</td><td class="text-end fw-bold" style="color:var(--p)">${fm(sum('ok'))}</td><td></td></tr></tfoot></table></div></div><button class="btn btn-brand mt-3" onclick="pdfRpt()"><i class="bi bi-file-earmark-pdf"></i> Export PDF</button>`;
  },
  async usr(m) {
    UU = await call('listUsers', [TK]);
    m.innerHTML = `<div class="d-flex justify-content-between mb-3"><h4 class="fw-bold">ผู้ดูแลระบบ &amp; สิทธิ์</h4><button class="btn btn-brand" onclick="editU()"><i class="bi bi-plus-lg"></i> เพิ่มผู้ดูแล</button></div><div class="card p-3"><div class="table-responsive"><table class="table align-middle mb-0"><thead class="thead-g"><tr><th>ชื่อผู้ใช้</th><th>ชื่อ</th><th>สิทธิ์</th><th></th></tr></thead><tbody>${UU.map(u => `<tr><td>${esc(u.user)}</td><td>${esc(u.name)}</td><td><span class="badge" style="background:var(--pu)">${esc(u.role)}</span></td><td><button class="btn btn-outline-secondary btn-sm" onclick="editU('${esc(u.user)}')"><i class="bi bi-pencil"></i></button> <button class="btn btn-danger btn-sm" onclick="delU('${esc(u.user)}')"><i class="bi bi-trash3"></i></button></td></tr>`).join('')}</tbody></table></div></div><p class="small text-muted mt-2">สิทธิ์: Super ทุกอย่าง · Finance ตรวจสลิป · Merchandise สินค้า · Event โต๊ะ/ข่าว · Viewer ดูรายงาน</p>`;
  },
  async set(m) {
    CC = await call('adminCfg', [TK]);
    m.innerHTML = `<div class="card p-4"><h5 class="fw-bold">⚙️ ตั้งค่าระบบ</h5><p class="text-muted">ชื่อระบบ: ${esc(CC.SystemName)} · PromptPay: ${esc(CC.PromptPay) || '-'} · Telegram: ${CC.TelegramToken ? 'ตั้งค่าแล้ว' : 'ยังไม่ตั้งค่า'}</p><button class="btn btn-brand" onclick="editSet()"><i class="bi bi-pencil-square"></i> แก้ไขการตั้งค่า (ชื่อ โลโก้ ภาพส่วนหัว QR PromptPay Telegram รหัสผ่าน)</button></div>`;
  }
};
function seatPv() {
  const r = +$('#trw').value || 1, c = +$('#tcl').value || 1, n = +$('#tst').value || 1, q = Math.min(n, 20);
  $('#tt').textContent = r * c; $('#tp2').textContent = r * c * n;
  const bk = {}; D.tables.forEach(t => bk[t.id] = t.state);
  $('#pv').innerHTML = `<div class="text-center py-2 rounded-4 text-white fw-bold mb-3 mx-auto" style="background:linear-gradient(135deg,#4a2c6d,#db0862);min-width:${c * 96}px">🎤 เวที</div><div class="d-grid gap-3" style="grid-template-columns:repeat(${c},84px);min-width:${c * 96}px;justify-content:center">${Array.from({ length: r * c }, (_, k) => {
    const id = 'T' + String(k + 1).padStart(2, '0'), col = { free: '#26a69a', wait: '#fbc02d', ok: '#ef5350' }[bk[id] || 'free'];
    return `<div class="position-relative" style="width:84px;height:84px">${Array.from({ length: q }, (_, i) => `<i style="position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px;border-radius:6px 6px 3px 3px;background:${col};box-shadow:0 2px 0 rgba(0,0,0,.25);transform:rotate(${i * 360 / q}deg) translateY(-34px)"></i>`).join('')}<div class="position-absolute d-grid text-white fw-bold small" style="inset:20px;place-items:center;border-radius:50%;background:${col};box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 2px 3px rgba(255,255,255,.5)">${id}</div></div>`;
  }).join('')}</div>`;
}
async function review(i) {
  const r = LST[i], can = ROLE === 'Super' || ROLE === 'Finance', sl = r.slip ? await call('slipImage', [TK, r.slip]) : '';
  const x = await Swal.fire({ title: r.id, showConfirmButton: can, showDenyButton: can, showCancelButton: true, confirmButtonText: '✅ ยืนยัน', denyButtonText: '❌ ไม่อนุมัติ', cancelButtonText: 'ปิด', confirmButtonColor: '#26a69a',
    html: `<div class="text-start">ผู้ทำรายการ: <b>${esc(r.who)}</b><br>โทร: ${esc(r.phone)}<br>จำนวน: ${fm(r.amt)} บาท${r.addr ? '<br>ที่อยู่จัดส่ง: ' + esc(r.addr) : ''}${r.items && r.items.length ? '<br>' + r.items.map(i => esc(i.ProductName) + ' ' + esc(i.Size) + '×' + i.Qty).join(', ') : ''}<br>${sl ? `<img src="${sl}" class="img-fluid rounded-4 mt-2" style="max-height:280px;display:block;margin:auto">` : 'ไม่มีสลิป'}</div>` });
  if (x.isConfirmed) { await call('verify', [TK, r.id, true, '']); done(); }
  else if (x.isDenied) { const q = await Swal.fire({ title: 'เหตุผลที่ไม่อนุมัติ', input: 'text', showCancelButton: true, confirmButtonColor: '#d32f2f' }); if (q.isConfirmed) { await call('verify', [TK, r.id, false, q.value]); done(); } }
}
async function editP(id) {
  const p = id ? D.products.find(x => x.id == id) : { name: '', color: '-', price: '', emoji: '🛍️', sizes: [] };
  const v = await form(id ? '✏️ แก้ไขสินค้า' : '➕ เพิ่มสินค้า', [{ k: 'name', l: 'ชื่อสินค้า', h: 'เช่น เสื้อผ้าป่า' }, { k: 'color', l: 'สี', h: 'ใส่ - ถ้าไม่มีสี' }, { k: 'price', l: 'ราคาต่อชิ้น (บาท)', t: 'number' }, { k: 'emoji', l: 'ไอคอน (อีโมจิ)' }, { k: 'img', l: 'รูปภาพตัวอย่าง', t: 'file', h: 'ไม่เลือก = ใช้รูปเดิม' }, { k: 'sz', l: 'ไซซ์ & จำนวนสต็อก', t: 'textarea', h: '1 บรรทัดต่อ 1 ไซซ์ รูปแบบ ชื่อไซซ์,จำนวนทั้งหมด เช่น M,100' }], { ...p, sz: p.sizes.map(s => s.size + ',' + s.total).join('\n') });
  if (!v) return;
  const sizes = v.sz.split('\n').map(l => l.split(',')).filter(a => a[0].trim()).map(a => ({ k: a[0].trim(), n: +a[1] || 0 }));
  await call('saveProduct', [TK, { id, name: v.name, color: v.color, price: v.price, emoji: v.emoji, img: v.img, sizes }]); done();
}
async function delP(id) { if (await sure('ลบสินค้านี้?')) { await call('deleteProduct', [TK, id]); done(); } }
async function saveT() { await call('saveTables', [TK, { rows: trw.value, cols: tcl.value, price: tpr.value, seats: tst.value }]); done(); }
async function editC(sheet, id) {
  const isN = sheet === 'News', x = id ? (isN ? D.news : D.schedule).find(a => a[isN ? 'NewsID' : 'ScheduleID'] == id) : {};
  const Fs = isN ? [{ k: 'title', l: 'หัวข้อข่าว' }, { k: 'detail', l: 'รายละเอียด', t: 'textarea' }, { k: 'img', l: 'รูปภาพประกอบ', t: 'file', h: 'ไม่เลือก = ใช้รูปเดิม' }]
    : [{ k: 'date', l: 'วันที่/เวลา', h: 'เช่น 20 ธ.ค. 2569 · 09.00 น.' }, { k: 'title', l: 'หัวข้อกิจกรรม' }, { k: 'detail', l: 'รายละเอียด', t: 'textarea' }, { k: 'img', l: 'รูปภาพประกอบ', t: 'file', h: 'ไม่เลือก = ใช้รูปเดิม' }];
  const v = await form(id ? '✏️ แก้ไข' : '➕ เพิ่ม', Fs, { title: x.Title, detail: x.Detail, date: x.DateText });
  if (!v) return; await call(isN ? 'saveNews' : 'saveSchedule', [TK, { ...v, id }]); done();
}
async function delC(s, id) { if (await sure('ลบรายการนี้?')) { await call('deleteRec', [TK, s, id]); done(); } }
async function editU(u) {
  const x = u ? UU.find(a => a.user === u) : {};
  const v = await form(u ? 'แก้ไขผู้ดูแล' : 'เพิ่มผู้ดูแล', [{ k: 'user', l: 'ชื่อผู้ใช้' }, { k: 'name', l: 'ชื่อ-สกุล' }, { k: 'role', l: 'สิทธิ์', h: 'Super / Finance / Merchandise / Event / Viewer' }, { k: 'pass', l: 'รหัสผ่าน', t: 'password', h: u ? 'เว้นว่าง = ไม่เปลี่ยน' : '' }], x);
  if (v) { await call('saveUser', [TK, v]); adm(); }
}
async function delU(u) { if (await sure('ลบผู้ดูแลนี้?')) { await call('deleteUser', [TK, u]); adm(); } }
async function editSet() {
  const c = CC;
  const v = await form('⚙️ ตั้งค่าระบบ', [{ k: 'name', l: 'ชื่อระบบ' }, { k: 'sub', l: 'ชื่องาน' }, { k: 'target', l: 'เป้าหมายเงินบริจาค', t: 'number' }, { k: 'obj', l: 'วัตถุประสงค์การระดมทุน', t: 'textarea' }, { k: 'pp', l: 'เบอร์/เลข PromptPay' }, { k: 'tgToken', l: 'Telegram Bot Token' }, { k: 'tgChat', l: 'Telegram Chat ID ผู้ดูแล' }, { k: 'newPass', l: 'รหัสผ่านใหม่ของคุณ', t: 'password', h: 'เว้นว่าง = ไม่เปลี่ยน' }, { k: 'logo', l: 'โลโก้ระบบ', t: 'file' }, { k: 'banner', l: 'ภาพส่วนหัว', t: 'file' }, { k: 'qr', l: 'รูป QR PromptPay', t: 'file' }],
    { name: c.SystemName, sub: c.Subtitle, target: c.Target, obj: c.Objective, pp: c.PromptPay, tgToken: c.TelegramToken, tgChat: c.TelegramChat });
  if (v) { await call('saveSettings', [TK, v]); done(); }

  const R = RR, s = t => R.filter(r => r.st === t).reduce((a, r) => a + r.amt, 0);
  printHtml(`<html><head><meta charset="utf-8"><style>*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{font-family:Sarabun,sans-serif}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:5px}th{background:#4a2c6d;color:#fff}tr:nth-child(even) td{background:#f6f0fa}h2,h3{text-align:center;color:#4a2c6d}</style></head><body><h2>รายงานผ้าป่าเพื่อการศึกษา</h2><h3>โรงเรียนร่มเกล้าพิทยาสรรค์</h3><p>ยืนยันแล้ว ${fm(s('ok'))} บาท · รอตรวจสอบ ${fm(s('wait'))} บาท · ${R.length} รายการ</p><table><tr><th>วันที่</th><th>เลขที่</th><th>ประเภท</th><th>ผู้ทำรายการ</th><th>รายละเอียด</th><th>จำนวนเงิน</th><th>สถานะ</th></tr>${R.map(r => `<tr><td>${dt(r.at)}</td><td>${esc(r.id)}</td><td>${r.k}</td><td>${esc(r.who)}</td><td>${esc(r.det)}</td><td align="right">${fm(r.amt)}</td><td>${ST[r.st][0]}</td></tr>`).join('')}</table></body></html>`);
}
boot();
