<style>
:root{--bg:#faf7fb;--card:#fff;--tx:#2a1a3a;--mut:#7a6b88;--bd:#eee5f2;--pri:#db0862;--pri2:#f51b70;--pur:#4A2C6D;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17101f;--card:#221832;--tx:#f3ecf8;--mut:#b3a3c4;--bd:#35294a;color-scheme:dark}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Sarabun',sans-serif;background:var(--bg);background-image:radial-gradient(900px 520px at 8% -10%,rgba(74,44,109,.12),transparent 60%),radial-gradient(800px 520px at 100% 0%,rgba(219,8,98,.08),transparent 55%),radial-gradient(700px 500px at 50% 110%,rgba(255,138,101,.09),transparent 60%);background-attachment:fixed;color:var(--tx);margin:0}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:56px 56px;opacity:.35;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 15%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 15%,transparent 70%)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:0 4px 18px rgba(74,44,109,.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.6rem 1.1rem;border-radius:12px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));transition:.2s;cursor:pointer}
.btn:hover{transform:translateY(-1px);filter:brightness(1.07)}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.inp{width:100%;padding:.6rem .8rem;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
.inp:focus{outline:2px solid var(--pri2);border-color:transparent}
.lbl{font-size:.85rem;color:var(--mut);margin-bottom:.2rem;display:block}
.badge{display:inline-block;padding:.1rem .6rem;border-radius:99px;font-size:.75rem;font-weight:600;color:#fff}
.sk{background:linear-gradient(90deg,var(--bd) 25%,var(--card) 50%,var(--bd) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:14px}
@keyframes sk{to{background-position:-200% 0}}
.spin{width:44px;height:44px;border:5px solid #fff4;border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.tb{transition:.15s;cursor:pointer}.tb:hover{transform:scale(1.03)}
.nav-a{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;border-radius:12px;color:var(--mut);font-weight:500;cursor:pointer}
.nav-a.on,.nav-a:hover{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;color:#fff;position:relative;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.22),0 10px 18px rgba(0,0,0,.22),inset 0 2px 2px rgba(255,255,255,.55),inset 0 -4px 6px rgba(0,0,0,.2);text-shadow:0 3px 4px rgba(0,0,0,.35);transition:transform .2s}
.ico::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,0));border-radius:14px 14px 40% 40%;pointer-events:none}
.tb:hover .ico,.ico:hover{transform:translateY(-2px) rotate(-4deg) scale(1.06)}
.tw{overflow-x:auto}
.fade{animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.inp{border-radius:16px}.card{border-radius:24px}
.swal2-popup{border-radius:28px!important;padding:1.6rem!important;background:var(--card)!important;color:var(--tx)!important;font-family:'Sarabun',sans-serif!important;box-shadow:0 20px 60px rgba(74,44,109,.3)!important}
.swal2-title,.swal2-html-container{color:var(--tx)!important}
.swal2-input,.swal2-textarea,.swal2-file,.swal2-select{border-radius:16px!important;border:1px solid var(--bd)!important;background:var(--bg)!important;color:var(--tx)!important;box-shadow:none!important;margin:.4rem 0!important;width:100%!important;box-sizing:border-box!important}
.swal2-input:focus,.swal2-textarea:focus{border-color:var(--pri2)!important;box-shadow:0 0 0 3px rgba(245,27,112,.2)!important}
.swal2-confirm,.swal2-deny,.swal2-cancel{border-radius:14px!important;padding:.6rem 1.4rem!important;font-weight:600!important}
.swal2-icon{border-radius:50%!important}
.ni{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--g);box-shadow:0 4px 10px rgba(0,0,0,.18),inset 0 1px 1px rgba(255,255,255,.55),inset 0 -3px 5px rgba(0,0,0,.15);position:relative;overflow:hidden;transition:transform .25s}
.ni::after{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0));pointer-events:none}
.nav-a:hover .ni{transform:scale(1.08) rotate(-4deg)}.nav-a.on .ni{box-shadow:0 0 0 2px rgba(255,255,255,.75),0 4px 10px rgba(0,0,0,.22)}
.ni.lg{width:38px;height:38px;border-radius:12px}.nav-a{font-weight:600}.nav-a.on .ni.lg{box-shadow:0 0 0 2px rgba(255,255,255,.8),0 4px 10px rgba(0,0,0,.25)}
.sh{display:flex;align-items:center;gap:.9rem;margin:2rem 0 .8rem;font-weight:700;font-size:1.05rem;color:var(--tx)}
.sh::after{content:"";flex:1;height:3px;border-radius:99px;background:linear-gradient(90deg,#4A2C6D,#db0862 55%,#FF8A65)}
.rv{opacity:0;transform:translateY(20px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
.card{transition:box-shadow .3s,border-color .3s}.card:hover{box-shadow:0 10px 30px rgba(74,44,109,.12);border-color:rgba(219,8,98,.25)}
.btn{position:relative;overflow:hidden}.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s}.btn:hover::after{left:130%}
.tl{position:relative;padding-left:18px;border-left:2px solid var(--bd)}.tli{position:relative;padding-bottom:14px}
.tli::before{content:"";position:absolute;left:-25px;top:4px;width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,#db0862,#FF8A65);box-shadow:0 0 0 4px var(--card)}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.btn::after{display:none}}
</style>

<body>
<!-- หน้าจอกำลังโหลด -->
<div id="load" class="fixed inset-0 z-[9999] hidden place-items-center" style="background:#4A2C6Dcc">
  <div class="spin"></div>
</div>

<!-- คอนเทนเนอร์หลัก -->
<div id="app" class="min-h-screen"></div>

<script>
/**
 * ตั้งค่าเมื่อโฮสต์หน้านี้นอก Apps Script (เช่น GitHub Pages)
 * ใส่ URL ของ Web App ที่ Deploy แล้ว เช่น 'https://script.google.com/macros/s/XXXX/exec'
 * ปล่อยว่างไว้เมื่อเปิดผ่าน Web App ของ Apps Script โดยตรง
 */
const API_URL = '';
const IN_GAS = !!(window.google && google.script && google.script.run);
const MOCK = !IN_GAS && !API_URL;   // โหมดทดสอบด้วยข้อมูลจำลองในเบราว์เซอร์

const $ = s => document.querySelector(s);
const fm = n => Number(n || 0).toLocaleString('th-TH');
const SZ = ['S', 'M', 'L', 'XL', '2XL'];
const EMPTY = () => ({
  cfg: {
    name: 'ระบบผ้าป่าเพื่อการศึกษา',
    sub: 'ผ้าป่าสามัคคีเพื่อการศึกษา เพื่อพัฒนาคุณภาพการเรียนรู้',
    logo: '',
    banner: '',
    target: 500000,
    pp: '0812345678',
    ppImg: '',
    ppDon: '0812345678',
    ppDonImg: '',
    ppShop: '0812345678',
    ppShopImg: '',
    ppTbl: '0812345678',
    ppTblImg: '',
    tgToken: '',
    tgChat: '',
    seat: 8,
    price: 3000,
    obj: 'เพื่อสมทบทุนจัดซื้ออุปกรณ์ห้องปฏิบัติการคอมพิวเตอร์และปรับปรุงภูมิทัศน์โรงเรียนร่มเกล้าพิทยาสรรค์',
    rows: 3,
    cols: 4
  },
  don: [],
  ord: [],
  tbl: [],
  prods: [],
  news: [],
  sch: [],
  tables: []
});

let S = EMPTY(), FULL = false, TK = '', LT = 0, LAST = null;
let V = 'home', A = false, AT = 'dash', cart = [], charts = [], menu = false;

try {
  TK = sessionStorage.getItem('rk_t') || '';
} catch(e) {}
A = !!TK;

const busy = async f => {
  const el = $('#load');
  if (el) el.style.display = 'grid';
  try {
    return await f();
  } finally {
    if (el) el.style.display = 'none';
  }
};

/**
 * เรียก RPC ผ่าน google.script.run (และมีระบบ Mock จำลองอัตโนมัติหากทดสอบนอก Apps Script)
 */
const rpc = (fn, ...a) => new Promise(res => {
  // หากรันใน Google Apps Script แท้
  if (window.google && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(r => {
        if (r && r.code == 'AUTH') authLost();
        res(r || { ok: false, msg: 'ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์' });
      })
      .withFailureHandler(e => {
        res({ ok: false, msg: (e && e.message) || 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ' });
      })[fn](...a);
    return;
  }

  // เรียก Web App ผ่าน HTTP (กรณีโฮสต์บน GitHub Pages)
  if (API_URL) {
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn, args: a }),
      redirect: 'follow'
    })
      .then(r => r.json())
      .then(r => {
        if (r && r.code == 'AUTH') authLost();
        res(r || { ok: false, msg: 'ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์' });
      })
      .catch(e => res({ ok: false, msg: 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ' }));
    return;
  }

  // หากรันใน Local Storage Fallback (สำหรับการทดสอบในเบราว์เซอร์)
  setTimeout(() => {
    try {
      res(mockRpc(fn, a));
    } catch(err) {
      res({ ok: false, msg: 'Mock Error: ' + err.message });
    }
  }, 300);
});

// Mock Local Storage สำหรับพรีวิว
function getStorage(k, def) {
  try {
    const v = localStorage.getItem('rk_gas_' + k);
    return v ? JSON.parse(v) : def;
  } catch(e) { return def; }
}
function setStorage(k, v) {
  try {
    localStorage.setItem('rk_gas_' + k, JSON.stringify(v));
  } catch(e) {}
}

function mockRpc(fn, a) {
  let db = getStorage('db', null);
  if (!db) {
    db = {
      cfg: EMPTY().cfg,
      prods: [
        { id: 1, name: 'เสื้อโปโลที่ระลึกผ้าป่า 69', color: 'ม่วง', price: 350, emoji: '👕', img: '', sz: { S: {n:50, s:4}, M: {n:80, s:12}, L: {n:100, s:15}, XL: {n:70, s:8}, '2XL': {n:30, s:2} } },
        { id: 2, name: 'เสื้อยืดคอกลมผ้าป่าศิษย์เก่า', color: 'แสด', price: 250, emoji: '🎽', img: '', sz: { S: {n:40, s:2}, M: {n:60, s:5}, L: {n:80, s:6}, XL: {n:50, s:3}, '2XL': {n:20, s:1} } },
        { id: 3, name: 'แก้วน้ำเก็บความเย็นร่มเกล้าฯ', color: '-', price: 299, emoji: '🥤', img: '', sz: { 'ฟรีไซซ์': {n:100, s:10} } }
      ],
      news: [
        { id: 1718000000000, at: Date.now() - 86400000 * 2, t: 'ขอเชิญร่วมทำบุญทอดผ้าป่าสามัคคีเพื่อการศึกษา ประจำปี 2569', d: 'โรงเรียนร่มเกล้าพิทยาสรรค์ ขอเชิญชวนศิษย์เก่า ผู้ปกครอง และผู้มีจิตศรัทธา ร่วมทำบุญทอดผ้าป่าเพื่อการศึกษาและพัฒนาคุณภาพการเรียนรู้', img: '' }
      ],
      sch: [
        { id: 1, d: '20 ธ.ค. 2569 · 08.30 น.', t: 'พิธีตักบาตรพระสงฆ์ 9 รูป', det: 'ณ บริเวณลานหน้าเสาธง โรงเรียนร่มเกล้าพิทยาสรรค์', img: '' },
        { id: 2, d: '20 ธ.ค. 2569 · 10.30 น.', t: 'พิธีทอดผ้าป่าเพื่อการศึกษา', det: 'ณ หอประชุมโรงเรียนร่มเกล้าพิทยาสรรค์', img: '' },
        { id: 3, d: '20 ธ.ค. 2569 · 12.00 น.', t: 'ร่วมรับประทานอาหารโต๊ะจีนสามัคคี', det: 'การแสดงของนักเรียนและการพบปะศิษย์เก่า', img: '' }
      ],
      don: [
        { id: 'DON-2569-000001', at: Date.now() - 3600000 * 5, name: 'นายสมชาย ใจบุญ', phone: '0812345678', email: 'somchai@example.com', type: 'ศิษย์เก่า', amount: 5000, show: true, wish: 'ขอให้โรงเรียนเจริญก้าวหน้า', rc: true, slip: '', status: 'ok', reason: '' },
        { id: 'DON-2569-000002', at: Date.now() - 3600000 * 2, name: 'นางสาวพิมพ์ใจ รักเรียน', phone: '0899887766', email: '', type: 'ผู้ปกครอง', amount: 1000, show: true, wish: 'ร่วมบุญเพื่อเด็กๆ', rc: false, slip: '', status: 'ok', reason: '' }
      ],
      ord: [
        { id: 'ORD-2569-000001', at: Date.now() - 7200000, name: 'นายมานะ อดทน', phone: '0845556677', method: 'รับที่โรงเรียน', addr: '', items: [{ id: 1, p: 'เสื้อโปโลที่ระลึกผ้าป่า 69', s: 'L', q: 2, price: 350 }], total: 700, ship: 0, slip: '', status: 'ok', reason: '' }
      ],
      tbl: [
        { id: 'TBL-2569-00001', at: Date.now() - 86400000, t: 'T01', name: 'ศิษย์เก่ารุ่น 25', org: 'ศิษย์เก่ารุ่น 25', phone: '0811122233', pax: 8, note: 'โต๊ะหน้าเวที', total: 3000, slip: '', status: 'ok', reason: '' }
      ],
      tables: Array.from({ length: 12 }, (_, i) => 'T' + String(i + 1).padStart(2, '0')),
      pass: 'admin1234'
    };
    setStorage('db', db);
  }

  if (fn === 'getPublic') {
    const dn = db.don.filter(d => d.status === 'ok');
    const sum = dn.reduce((a, b) => a + b.amount, 0);
    const ordOk = db.ord.filter(o => o.status === 'ok');
    const totalItems = ordOk.reduce((a, o) => a + o.items.reduce((x, i) => x + i.q, 0), 0);
    return {
      ok: true,
      data: {
        cfg: db.cfg,
        prods: db.prods,
        news: db.news,
        sch: db.sch,
        tables: Array.from({ length: (db.cfg.rows || 3) * (db.cfg.cols || 4) }, (_, i) => 'T' + String(i + 1).padStart(2, '0')),
        agg: { sum: sum, n: dn.length, items: totalItems },
        don: db.don.map(d => ({ id: d.id, at: d.at, name: d.name, type: d.type, amount: d.amount, show: d.show, status: d.status })),
        tbl: db.tbl.map(t => ({ t: t.t, status: t.status }))
      }
    };
  }

  if (fn === 'adminLogin') {
    if (a[0] === 'admin' && (a[1] === db.pass || a[1] === 'admin1234')) {
      return { ok: true, token: 'mock-token-gas-' + Date.now() };
    }
    return { ok: false, msg: 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง (รหัสเริ่มต้นคือ admin1234)' };
  }

  if (fn === 'adminLogout') return { ok: true };

  if (fn === 'adminGetAll') {
    const pub = mockRpc('getPublic', []).data;
    pub.don = db.don;
    pub.ord = db.ord;
    pub.tbl = db.tbl;
    return { ok: true, data: pub };
  }

  if (fn === 'submitDonation') {
    const p = a[0];
    const id = 'DON-2569-' + String(db.don.length + 1).padStart(6, '0');
    db.don.unshift({
      id: id,
      at: Date.now(),
      name: p.name,
      phone: p.phone,
      email: p.email || '',
      type: p.type || 'บุคคลทั่วไป',
      amount: Number(p.amount),
      show: Boolean(p.show),
      wish: p.wish || '',
      rc: Boolean(p.rc),
      slip: p.slip || '',
      status: 'wait',
      reason: ''
    });
    setStorage('db', db);
    return { ok: true, id: id };
  }

  if (fn === 'submitOrder') {
    const p = a[0];
    const id = 'ORD-2569-' + String(db.ord.length + 1).padStart(6, '0');
    let sub = 0;
    const enriched = [];
    for (const it of p.items) {
      const prod = db.prods.find(x => x.id === it.id);
      if (prod && prod.sz[it.s]) {
        prod.sz[it.s].s += it.q;
        sub += prod.price * it.q;
        enriched.push({ id: it.id, p: prod.name, s: it.s, q: it.q, price: prod.price });
      }
    }
    const ship = p.method === 'จัดส่ง' ? 40 : 0;
    const total = sub + ship;
    db.ord.unshift({
      id: id,
      at: Date.now(),
      name: p.name,
      phone: p.phone,
      method: p.method,
      addr: p.addr || '',
      items: enriched,
      total: total,
      ship: ship,
      slip: p.slip || '',
      status: 'wait',
      reason: ''
    });
    setStorage('db', db);
    return { ok: true, id: id, total: total };
  }

  if (fn === 'submitTable') {
    const p = a[0];
    const id = 'TBL-2569-' + String(db.tbl.length + 1).padStart(5, '0');
    db.tbl.unshift({
      id: id,
      at: Date.now(),
      t: p.t,
      name: p.name,
      org: p.org || '',
      phone: p.phone,
      pax: Number(p.pax),
      note: p.note || '',
      total: db.cfg.price || 3000,
      slip: p.slip || '',
      status: 'wait',
      reason: ''
    });
    setStorage('db', db);
    return { ok: true, id: id };
  }

  if (fn === 'searchItem') {
    const id = String(a[0] || '').trim().toUpperCase();
    const phone = String(a[1] || '').trim().replace(/[^0-9]/g, '');

    const don = db.don.find(x => x.id.toUpperCase() === id && x.phone.replace(/[^0-9]/g, '') === phone);
    if (don) {
      return { ok: true, rec: { kd: 'don', id: don.id, at: don.at, name: don.name, phone: don.phone, email: don.email, type: don.type, amt: don.amount, show: don.show, wish: don.wish, rc: don.rc, status: don.status, reason: don.reason } };
    }

    const ord = db.ord.find(x => x.id.toUpperCase() === id && x.phone.replace(/[^0-9]/g, '') === phone);
    if (ord) {
      return { ok: true, rec: { kd: 'ord', id: ord.id, at: ord.at, name: ord.name, phone: ord.phone, method: ord.method, addr: ord.addr, items: ord.items, amt: ord.total, ship: ord.ship, status: ord.status, reason: ord.reason } };
    }

    const tbl = db.tbl.find(x => x.id.toUpperCase() === id && x.phone.replace(/[^0-9]/g, '') === phone);
    if (tbl) {
      return { ok: true, rec: { kd: 'tbl', id: tbl.id, at: tbl.at, t: tbl.t, name: tbl.name, org: tbl.org, phone: tbl.phone, pax: tbl.pax, note: tbl.note, amt: tbl.total, status: tbl.status, reason: tbl.reason } };
    }

    return { ok: false, msg: 'ไม่พบรายการที่ตรงกับเลขที่และเบอร์โทรนี้' };
  }

  if (fn === 'adminReview') {
    const id = a[1];
    const act = a[2];
    const reason = a[3] || '';
    let target = db.don.find(x => x.id === id) || db.ord.find(x => x.id === id) || db.tbl.find(x => x.id === id);
    if (target) {
      target.status = act;
      target.reason = reason;
      setStorage('db', db);
      return { ok: true };
    }
    return { ok: false, msg: 'ไม่พบรายการ' };
  }

  if (fn === 'adminGetSlip') {
    return { ok: true, data: a[1] || '' };
  }

  if (fn === 'adminSaveConfig') {
    Object.assign(db.cfg, a[1]);
    if (a[2]) db.pass = a[2];
    setStorage('db', db);
    return { ok: true };
  }

  if (fn === 'adminSaveProducts') {
    db.prods = a[1];
    setStorage('db', db);
    return { ok: true };
  }

  if (fn === 'adminSaveNews') {
    db.news = a[1];
    setStorage('db', db);
    return { ok: true };
  }

  if (fn === 'adminSaveSchedule') {
    db.sch = a[1];
    setStorage('db', db);
    return { ok: true };
  }

  if (fn === 'adminSaveTables') {
    Object.assign(db.cfg, a[1]);
    setStorage('db', db);
    return { ok: true };
  }

  if (fn === 'adminResetAll') {
    db.don = [];
    db.ord = [];
    db.tbl = [];
    db.prods.forEach(p => Object.values(p.sz).forEach(z => z.s = 0));
    setStorage('db', db);
    return { ok: true };
  }

  return { ok: false, msg: 'Unknown RPC: ' + fn };
}

const fileURL = f => new Promise(r => {
  if (!f) return r('');
  const x = new FileReader();
  x.onerror = () => r('');
  x.onload = () => {
    const src = x.result;
    if (f.size < 300000 && /png/.test(f.type)) return r(src);
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1000 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * k));
      c.height = Math.max(1, Math.round(im.height * k));
      const g = c.getContext('2d');
      g.fillStyle = '#fff';
      g.fillRect(0, 0, c.width, c.height);
      g.drawImage(im, 0, 0, c.width, c.height);
      r(c.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => r(src);
    im.src = src;
  };
  x.readAsDataURL(f);
});

  const n = dn.value.trim(), p = dp.value.trim(), a = +da.value;
  if (!n || !p || !a) return toast('กรุณากรอกชื่อ เบอร์โทร และจำนวนเงิน', 'warning');
  if (!slip.files[0]) return toast('กรุณาอัปโหลดสลิปการโอนเงิน', 'warning');

  const slipData = await fileURL(slip.files[0]);
  const r = await busy(async () => rpc('submitDonation', {
    name: n,
    phone: p,
    email: de.value.trim(),
    type: dt.value,
    amount: a,
    show: ds.checked,
    wish: dw.value,
    rc: dr.checked,
    slip: slipData
  }));

  if (!r.ok) return errT(r, 'ส่งข้อมูลไม่สำเร็จ');
  await Swal.fire({
    icon: 'success',
    title: 'ส่งข้อมูลสำเร็จ',

  await busy(loadPublic);
  go('home');
}

function addCart(id) {
  const p = S.prods.find(x => x.id == id);
  const szEl = $('#sz' + id);
  const qEl = $('#q' + id);
  if (!p || !szEl || !qEl) return;
  const s = szEl.value;
  const q = +qEl.value || 1;
  const z = p.sz[s];
  if (q > z.n - z.s) return toast('สินค้าไม่เพียงพอในไซซ์นี้', 'warning');
  cart.push({ id, p: p.name, c: p.color, s, q, price: p.price });
  cartDraw();
  toast('ใส่ตะกร้าแล้ว: ' + p.name + ' (' + s + ')');
}

const SHIP = 40;
function cartDraw() {
  const c = $('#cart');
  if (!c) return;
  const sub = cart.reduce((a, i) => a + i.q * i.price, 0);
  const n = cart.reduce((a, i) => a + i.q, 0);
  const om = $('#om');
  const ship = !!om && om.value == 'จัดส่ง';
  const fee = ship && cart.length ? SHIP : 0;
  const ab = $('#ab');
  if (ab) ab.classList.toggle('hidden', !ship);

  c.innerHTML = cart.length ? `
    <div class="grid gap-2 max-h-60 overflow-y-auto">
      ${cart.map((i, k) => `
        <div class="flex items-center gap-3 rounded-2xl p-2.5" style="background:var(--bg);border:1px solid var(--bd)">
          <span class="ico !w-10 !h-10 text-sm" style="background:${i.c == 'แสด' ? '#FF8A65' : '#4A2C6D'}">
            ${(S.prods.find(p => p.id == i.id) || {}).emoji || '🛍️'}
          </span>
          <div class="flex-1 min-w-0">
            <div class="font-semibold text-xs truncate">${i.p}</div>
            <div class="flex flex-wrap gap-1 mt-0.5">
              ${i.c != '-' ? '<span class="badge" style="background:#4A2C6D">' + i.c + '</span>' : ''}
              <span class="badge" style="background:#0288D1">ไซซ์ ${i.s}</span>
              <span class="badge" style="background:#26A69A">× ${i.q}</span>
            </div>
          </div>
          <div class="text-right">
            <b style="color:var(--pri)">${fm(i.q * i.price)}</b>
            <div><button type="button" class="text-xs" style="color:#D32F2F" onclick="cart.splice(${k},1);cartDraw()">🗑️ ลบ</button></div>
          </div>
        </div>
      `).join('')}
    </div>
    <div class="rounded-2xl p-3 mt-3 text-sm grid gap-1" style="background:var(--bg);border:1px solid var(--bd)">
      <div class="flex justify-between"><span>ค่าสินค้า (${n} ชิ้น)</span><span>${fm(sub)} บาท</span></div>
      ${ship ? '<div class="flex justify-between"><span>🚚 ค่าจัดส่ง</span><span>+' + SHIP + ' บาท</span></div>' : ''}

        <b>ยอดรวมสุทธิ</b>
        <b class="text-xl" style="color:var(--pri)">${fm(sub + fee)} บาท</b>
      </div>
    </div>
  ` : `
    <div class="rounded-2xl p-6 text-center text-sm" style="border:2px dashed var(--bd);color:var(--mut)">
      <div class="text-3xl mb-1">🛒</div>ยังไม่มีสินค้าในตะกร้า
    </div>
  `;
}

async function subOrd() {
  const on = $('#on'), op = $('#op'), om = $('#om'), oa = $('#oa'), slip = $('#slip');
  if (!cart.length) return toast('กรุณาเลือกสินค้าอย่างน้อย 1 รายการ', 'warning');
  if (!on.value.trim() || !op.value.trim() || !slip.files[0]) {
    return toast('กรอกข้อมูลผู้จองและแนบสลิปให้ครบถ้วน', 'warning');
  }
  if (om.value == 'จัดส่ง' && !oa.value.trim()) {
    return toast('กรุณากรอกที่อยู่สำหรับจัดส่ง', 'warning');
  }

  const slipData = await fileURL(slip.files[0]);
  const r = await busy(async () => rpc('submitOrder', {
    name: on.value.trim(),
    phone: op.value.trim(),
    method: om.value,
    addr: om.value == 'จัดส่ง' ? oa.value.trim() : '',
    items: cart.map(i => ({ id: i.id, s: i.s, q: i.q })),
    slip: slipData
  }));

  if (!r.ok) {
    errT(r, 'จองไม่สำเร็จ');
    await busy(loadPublic);
    draw();
    return;
  }
  cart = [];
  await Swal.fire({
    icon: 'success',
    title: 'จองสำเร็จ',
    html: 'เลขที่รายการ <b style="color:#db0862">' + r.id + '</b><br>ยอดรวมสุทธิ ' + fm(r.total) + ' บาท<br><span style="font-size:.85rem;color:#7a6b88">กรุณาจดเลขที่รายการ ใช้ค้นหาพร้อมเบอร์โทรภายหลัง</span>',
    confirmButtonColor: '#db0862'
  });
  await busy(loadPublic);
  go('home');
}

async function saveTbl() {
  const trw = $('#trw'), tcl = $('#tcl'), tpr = $('#tpr'), tst = $('#tst');
  const r = +trw.value, c = +tcl.value;
  if (r < 1 || c < 1) return toast('กรุณาระบุแถวและคอลัมน์', 'warning');
  const a = await busy(async () => {
    const x = await rpc('adminSaveTables', TK, { rows: r, cols: c, price: +tpr.value, seat: +tst.value });
    if (x.ok) await loadAdmin();
    return x;
  });
  if (!a.ok) return errT(a, 'บันทึกไม่สำเร็จ');
  toast('บันทึกเรียบร้อย');
  draw();
}

async function doS() {
  const sid = $('#sid'), sph = $('#sph');
  const id = sid.value.trim(), ph = sph.value.trim();
  if (!id || !ph) return toast('กรุณากรอกเลขที่รายการและเบอร์โทรศัพท์', 'warning');

  const x = await busy(() => rpc('searchItem', id, ph));
  if (!x.ok) {
    $('#sr').innerHTML = '<div class="rounded-3xl p-6 text-center fade mt-4" style="background:linear-gradient(135deg,#FFEBEE,#FFF3E0);border:2px dashed #EF5350;color:#C62828"><div class="text-4xl">🔍</div><b class="text-lg">ไม่พบรายการ</b><div class="text-sm mt-1">กรุณาตรวจสอบเลขที่รายการและเบอร์โทรศัพท์ให้ตรงกับตอนทำรายการ</div></div>';
    return;
  }

  const M = {
    don: ['💰 รายการบริจาค', '💰', 'linear-gradient(135deg,#db0862,#ff5c9a)'],
    ord: ['👕 รายการสั่งซื้อของที่ระลึก', '👕', 'linear-gradient(135deg,#f57c00,#FF8A65)'],
    tbl: ['🪑 จองโต๊ะ', '🪑', 'linear-gradient(135deg,#26A69A,#0288D1)']
  };

  const r = x.rec;
  if (r) {
    const m = M[r.kd];
    LAST = r;
    r.k = r.kd == 'tbl' ? m[0] + ' ' + r.t : m[0];
    r.ic = m[1];
    r.col = m[2];
  }
  $('#sr').innerHTML = r ? srCard(r) : '';
}

function pdf(title, body) {
  const w = window.open('', '_blank');
  if (!w) return toast('เบราว์เซอร์บล็อกหน้าต่างป็อปอัป กรุณาอนุญาต pop-up', 'warning');
  w.document.write(`<html><head><meta charset="utf-8"><title>${title}</title><link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet"><style>body{font-family:Sarabun,sans-serif;padding:30px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:6px;text-align:left}h2,h3{text-align:center;color:#4A2C6D}</style></head><body>${body}<script>setTimeout(()=>window.print(),600)<\/script></body></html>`);
  w.document.close();
}

function receipt(id) {
  const d = [LAST, ...S.don].find(x => x && x.id == id);
  if (!d) return toast('ไม่พบข้อมูลสำหรับออกใบรับเงิน', 'warning');
  pdf('ใบรับเงิน ' + id, `<h2>ใบรับเงินบริจาคเพื่อการศึกษา</h2><h3>โรงเรียนร่มเกล้าพิทยาสรรค์<br>สำนักงานเขตพื้นที่การศึกษามัธยมศึกษามุกดาหาร</h3><p>เลขที่ ${d.id}</p><p>ผู้บริจาค: ${d.name}</p><p>จำนวนเงิน: ${fm(d.amount || d.amt)} บาท</p><p>วัตถุประสงค์: สมทบทุนเพื่อการศึกษา</p><p>วันที่: ${new Date(d.at).toLocaleDateString('th-TH')}</p>`);

async function login() {
  const lu = $('#lu'), lp = $('#lp');
  const r = await busy(() => rpc('adminLogin', lu.value.trim(), lp.value));
  if (!r.ok) return toast(r.msg || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', 'error');
  TK = r.token;
  A = true;
  try { sessionStorage.setItem('rk_t', TK); } catch (e) {}
  const a = await busy(loadAdmin);
  if (!a.ok) errT(a, 'โหลดข้อมูลไม่สำเร็จ');
  draw();
}

async function logout() {
  const r = await Swal.fire({
    icon: 'question',
    title: 'ออกจากระบบ?',
    showCancelButton: true,
    confirmButtonColor: '#db0862',
    confirmButtonText: 'ออกจากระบบ',
    cancelButtonText: 'ยกเลิก'
  });
  if (r.isConfirmed) {
    const t = TK;
    A = false;
    TK = '';
    try { sessionStorage.removeItem('rk_t'); } catch (e) {}
    rpc('adminLogout', t);
    await busy(loadPublic);
    go('home');
  }
}

async function saveSet() {
  const cn = $('#cn'), cs = $('#cs'), ct = $('#ct'), tk = $('#tk'), tc = $('#tc'), cw = $('#cw');
  const r = await busy(async () => {
    const c = {
      name: cn.value,

      ppShop: $('#pp_shop').value,
      ppTbl: $('#pp_tbl').value,
      tgToken: tk.value,
      tgChat: tc.value
    };
    for (const [i, k] of [['cl', 'logo'], ['cb', 'banner'], ['pq_don', 'ppDonImg'], ['pq_shop', 'ppShopImg'], ['pq_tbl', 'ppTblImg']]) {

let RP = { p: 'all', d: new Date().toISOString().slice(0, 10), t: 'all' };
const PN = { all: 'ทั้งหมด', day: 'รายวัน', week: 'รายสัปดาห์', month: 'รายเดือน' };
const KC = { 'บริจาค': '#db0862', 'สินค้า': '#FF8A65', 'โต๊ะ': '#26A69A' };
const STT = { ok: 'ยืนยันแล้ว', wait: 'รอตรวจสอบ', no: 'ไม่ผ่าน' };
const rsum = (R, s) => R.filter(r => r.st == s).reduce((a, r) => a + r.amt, 0);

function rng() {
  const d = new Date(RP.d + 'T00:00:00');
  let a = 0, b = 9e15;
  if (RP.p == 'day') {
    a = +d;
    b = a + 864e5;
  } else if (RP.p == 'week') {
    const w = new Date(d);
    w.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    a = +w;
    b = a + 7 * 864e5;
  } else if (RP.p == 'month') {
    a = +new Date(d.getFullYear(), d.getMonth(), 1);
    b = +new Date(d.getFullYear(), d.getMonth() + 1, 1);
  }
  return [a, b];
}

function rptRows() {
  const [a, b] = rng();
  return [
    ...S.don.map(x => ({ id: x.id, k: 'บริจาค', who: x.name, det: x.type, amt: x.amount, st: x.status, at: x.at })),
    ...S.ord.map(x => ({ id: x.id, k: 'สินค้า', who: x.name, det: x.items.map(i => i.p + ' ' + i.s + '×' + i.q).join(', ') + (x.ship ? ' (+จัดส่ง)' : ''), amt: x.total, st: x.status, at: x.at })),
    ...S.tbl.map(x => ({ id: x.id, k: 'โต๊ะ', who: x.name, det: 'โต๊ะ ' + x.t + ' · ' + x.pax + ' คน', amt: x.total, st: x.status, at: x.at }))
  ].filter(r => r.at >= a && r.at < b && (RP.t == 'all' || r.k == RP.t)).sort((x, y) => y.at - x.at);
}

function rptLabel() {
  const [a, b] = rng();
  const f = t => new Date(t).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
  return RP.p == 'all' ? 'ข้อมูลทั้งหมด' : RP.p == 'day' ? f(a) : RP.p == 'week' ? f(a) + ' – ' + f(b - 1) : new Date(a).toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
}

const MTH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
function schFill() {
  const sdd = $('#sdd'), sdt = $('#sdt'), sd = $('#sd');
  const d = sdd.value, t = sdt.value;
  if (!d) return;
  const [y, m, dy] = d.split('-');
  sd.value = (+dy) + ' ' + MTH[m - 1] + ' ' + (+y + 543) + (t ? ' · ' + t.replace(':', '.') + ' น.' : '');
  schPv();
}

function schPv() {
  const q = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const spv = $('#spv'), sd = $('#sd'), st = $('#st'), sx = $('#sx');
  if (!spv) return;
  spv.innerHTML = `<div style="font-size:.78rem;font-weight:700;color:#db0862">${q(sd ? sd.value : '') || '(ยังไม่ระบุวันเวลา)'}</div><div style="font-weight:700">${q(st ? st.value : '') || '(ยังไม่มีชื่อกิจกรรม)'}</div><div style="font-size:.85rem;color:var(--mut)">${q(sx ? sx.value : '')}</div>`;
}

function editS(id) {
  const x = id ? S.sch.find(v => v.id == id) : { d: '', t: '', det: '', img: '' };
  const q = s => String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  const L = (c, t, h, i) => `<div style="text-align:left;margin-top:.9rem;padding:.8rem;border-radius:18px;border:1px solid var(--bd);background:var(--bg)"><label style="font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:.5rem"><span style="display:inline-grid;place-items:center;width:26px;height:26px;border-radius:9px;color:#fff;font-size:.8rem;background:${c}">${t[0]}</span>${t.slice(1)}</label>${h ? '<div style="font-size:.78rem;color:var(--mut);margin:.2rem 0 0 2rem">' + h + '</div>' : ''}<div style="margin-top:.5rem">${i}</div></div>`;

  Swal.fire({
    width: 'min(600px,94vw)',
    title: id ? '✏️ แก้ไขกำหนดการ' : '➕ เพิ่มกำหนดการใหม่',
    html: `<div style="max-height:64vh;overflow-y:auto;padding:0 .3rem">
      ${L('#db0862', '1วันที่และเวลา', 'เลือกระบบจะเติมข้อความให้อัตโนมัติ หรือพิมพ์เองได้', '<div style="display:grid;grid-template-columns:1fr 1fr;gap:.6rem"><div><div class="lbl">📅 เลือกวันที่</div><input id="sdd" type="date" class="inp" oninput="schFill()"></div><div><div class="lbl">⏰ เลือกเวลา</div><input id="sdt" type="time" class="inp" oninput="schFill()"></div></div><div class="lbl" style="margin-top:.6rem">ข้อความที่จะแสดงบนหน้าเว็บ</div><input id="sd" class="inp" placeholder="เช่น 20 ธ.ค. 2569 · 09.00 น." value="' + q(x.d) + '" oninput="schPv()">')}
      ${L('#4A2C6D', '2ชื่อกิจกรรม (จำเป็น)', 'เช่น พิธีทอดผ้าป่า, งานเลี้ยงสังสรรค์', '<input id="st" class="inp" placeholder="ชื่อกิจกรรม" value="' + q(x.t) + '" oninput="schPv()">')}
      ${L('#26A69A', '3รายละเอียด', 'สถานที่ สิ่งที่จะทำ หรือข้อควรทราบ', '<textarea id="sx" class="inp" rows="3" placeholder="รายละเอียดเพิ่มเติม" oninput="schPv()">' + q(x.det) + '</textarea>')}
      ${L('#FF8A65', '4รูปภาพประกอบ', 'เลือกไฟล์ใหม่เพื่อเปลี่ยนรูป', '<div id="svb" style="margin-bottom:.5rem;border-radius:16px;overflow:hidden;background:var(--card);text-align:center">' + (x.img ? '<img src="' + x.img + '" style="max-height:150px;margin:auto">' : '<div style="padding:.8rem;color:var(--mut)">ยังไม่มีรูป</div>') + '</div><input id="si" type="file" accept="image/*" class="inp" onchange="fileURL(this.files[0]).then(u=>{if(u)document.getElementById(&quot;svb&quot;).innerHTML=&quot;<img src=&apos;&quot;+u+&quot;&apos; style=&apos;max-height:150px;margin:auto&apos;>&quot;})">' + (x.img ? '<label style="display:flex;gap:.4rem;margin-top:.5rem;font-size:.85rem"><input id="srm" type="checkbox"> ลบรูปเดิมออก</label>' : ''))}
      ${L('#0288D1', '5ตัวอย่างที่จะแสดง', 'อัปเดตแบบเรียลไทม์', '<div id="spv" style="border-left:3px solid #db0862;padding:.2rem .8rem"></div>')}
    </div>`,
    didOpen: () => {
      if (!id) {
        const sdd = $('#sdd'), sdt = $('#sdt');
        if (sdd && sdt) {
          sdd.value = '2026-12-20';
          sdt.value = '09:00';
          schFill();
        }
      } else schPv();
    },
    showCancelButton: true,
    confirmButtonColor: '#db0862',
    confirmButtonText: '💾 บันทึก',
    cancelButtonText: 'ยกเลิก',
    preConfirm: async () => {
      const st = $('#st'), sd = $('#sd'), sx = $('#sx'), si = $('#si');
      if (!st.value.trim()) {
        Swal.showValidationMessage('กรุณากรอกชื่อกิจกรรม (ข้อ 2)');
        return false;
      }
      return { d: sd.value.trim(), t: st.value.trim(), det: sx.value, i: await fileURL(si.files[0]), rm: !!($('#srm') && $('#srm').checked) };
    }
  }).then(async r => {
    if (!r.isConfirmed) return;
    const v = r.value;
    if (id) {
      Object.assign(x, { d: v.d, t: v.t, det: v.det });
      if (v.i) x.img = v.i;
      else if (v.rm) x.img = '';
    } else {
      S.sch.push({ id: Date.now(), d: v.d, t: v.t, det: v.det, img: v.i });
    }
    if (await persist('sch')) toast('บันทึกกำหนดการเรียบร้อย');
    draw();
  });
}

async function delS(id) {
  const r = await Swal.fire({
    icon: 'warning',
    title: 'ลบกำหนดการนี้?',
    showCancelButton: true,
    confirmButtonColor: '#D32F2F'
  });
  if (r.isConfirmed) {
    S.sch = S.sch.filter(v => v.id != id);
    await persist('sch');
    draw();
  }
}

function fx() {
  document.querySelectorAll('#main>section,#main>div>.card,#am>div>.card,#am>div>div>.card').forEach(e => e.classList.add('rv'));
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('in');
      io.unobserve(e.target);
    }
  }), { threshold: .06 });
  document.querySelectorAll('.rv').forEach((e, i) => {
    e.style.transitionDelay = (i % 5) * 80 + 'ms';
    io.observe(e);
  });
  document.querySelectorAll('[data-n]').forEach(e => {
    const t = +e.dataset.n, t0 = performance.now();
    const f = n => {
      const p = Math.min(1, (n - t0) / 1200);
      e.textContent = fm(Math.round(t * (1 - Math.pow(1 - p, 3))));
      if (p < 1) requestAnimationFrame(f);
    };
    requestAnimationFrame(f);
  });
  document.querySelectorAll('[data-w]').forEach(e => {
    e.style.width = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      e.style.width = e.dataset.w + '%';
    }));
  });
}

const _d = draw;
draw = function() {
  _d();
  fx();
};
